<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tego dnia</title>
<meta name="description" content="Wpisz dowolny dzień i miesiąc, a dowiesz się, co istotnego wydarzyło się wtedy na świecie i w Polsce.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.85em' font-size='82'%3E%F0%9F%95%B0%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#f4f4f4;
    --ink:#111111;
    --ink-dim:#4a4a4a;
    --ink-faint:#8a8a8a;
    --accent:#000000;
    --line:rgba(0,0,0,.2);
    --line-soft:rgba(0,0,0,.1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0a0a0a;
      --bg-soft:#161616;
      --ink:#f2f2f2;
      --ink-dim:#b5b5b5;
      --ink-faint:#797979;
      --accent:#ffffff;
      --line:rgba(255,255,255,.22);
      --line-soft:rgba(255,255,255,.1);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--ink);text-decoration-color:var(--line);text-underline-offset:3px;}
  a:hover{text-decoration-color:currentColor;}
  button{font-family:inherit;}

  .screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8vh 24px;
    opacity:1;
    transition:opacity .5s ease;
  }
  .screen[hidden]{display:none;}
  .screen.leaving{opacity:0;}

  /* ---------- landing ---------- */
  #landing .inner{
    text-align:center;
    max-width:560px;
  }
  .eyebrow{
    display:block;
    font-size:.72rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:26px;
  }
  .big-date{
    display:block;
    font-weight:300;
    font-size:clamp(2.6rem,9vw,5rem);
    line-height:1.05;
    letter-spacing:-.02em;
    margin:0 0 22px;
    color:var(--ink);
  }
  .tagline{
    color:var(--ink-dim);
    font-size:1.02rem;
    max-width:420px;
    margin:0 auto 54px;
  }
  .picker{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    font-size:1.02rem;
    color:var(--ink-dim);
    margin-bottom:38px;
  }
  .picker span.joiner{color:var(--ink-faint);}
  select{
    appearance:none;
    -webkit-appearance:none;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--ink);
    font-family:inherit;
    font-size:1.02rem;
    padding:4px 22px 6px 2px;
    cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);
    background-position:calc(100% - 10px) 12px,calc(100% - 4px) 12px;
    background-size:6px 6px,6px 6px;
    background-repeat:no-repeat;
    transition:border-color .15s;
  }
  select:hover,select:focus{outline:none;border-color:var(--accent);}

  .cta{
    appearance:none;
    background:none;
    border:1px solid var(--line);
    color:var(--ink);
    padding:12px 30px;
    font-size:.92rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:2px;
    transition:border-color .15s,color .15s,background-color .15s;
  }
  .cta:hover{border-color:var(--accent);color:var(--accent);}
  .cta:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  .hint{
    display:block;
    margin-top:22px;
    font-size:.8rem;
    color:var(--ink-faint);
  }
  .hint button{
    background:none;border:none;padding:0;cursor:pointer;
    color:var(--ink-faint);text-decoration:underline;text-underline-offset:3px;
    font-size:inherit;
  }
  .hint button:hover{color:var(--accent);}

  /* ---------- results ---------- */
  #results{align-items:flex-start;padding-top:10vh;}
  .results-inner{max-width:760px;margin:0 auto;width:100%;}

  .results-head{
    display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:14px;
    border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:48px;
  }
  .results-head h1{
    font-weight:300;
    font-size:clamp(1.8rem,4.5vw,2.6rem);margin:0;color:var(--ink);
  }
  .back-link{
    background:none;border:none;color:var(--ink-dim);cursor:pointer;
    font-family:inherit;font-size:.85rem;letter-spacing:.05em;
    text-decoration:underline;text-underline-offset:3px;padding:0;
  }
  .back-link:hover{color:var(--accent);}

  .state-msg{
    text-align:center;color:var(--ink-dim);padding:60px 20px;
  }
  .state-msg .retry{
    display:block;margin:18px auto 0;
  }
  .err-detail{
    display:block;margin-top:14px;font-size:.78rem;color:var(--ink-faint);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }

  .section-label{
    display:block;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:16px;font-weight:600;
  }

  /* ---------- hero (featured event) ---------- */
  .hero{margin-bottom:76px;}
  .hero-title{
    font-size:clamp(1.7rem,4.2vw,2.5rem);font-weight:700;line-height:1.15;
    margin:0 0 24px;color:var(--ink);letter-spacing:-.01em;
  }
  .hero figure{margin:0 0 30px;}
  .hero img{
    width:100%;height:min(58vh,560px);object-fit:cover;display:block;
    border:1px solid var(--line);
    filter:grayscale(1) contrast(1.05);
  }
  .hero figcaption{
    font-size:.8rem;color:var(--ink-faint);margin-top:10px;text-align:right;
  }
  .hero .year{
    font-weight:700;color:var(--accent);
    font-size:1.3rem;margin-right:12px;
  }
  .hero .lead{
    font-size:clamp(1.25rem,2.6vw,1.6rem);font-weight:600;line-height:1.5;
    margin:0 0 20px;color:var(--ink);
  }
  .hero .extract{
    font-size:1.08rem;line-height:1.75;color:var(--ink-dim);margin:0 0 18px;
    max-width:640px;
  }
  .hero .inline-figure{margin:26px 0;max-width:640px;}
  .hero .inline-figure img{
    width:100%;max-height:340px;object-fit:cover;display:block;
    border:1px solid var(--line);
    filter:grayscale(1) contrast(1.05);
  }
  .hero .inline-figure figcaption{
    font-size:.78rem;color:var(--ink-faint);margin-top:8px;text-align:right;
  }
  .hero .src{font-size:.85rem;color:var(--ink-faint);}

  /* ---------- other events ---------- */
  .others h2{
    font-weight:600;
    font-size:1.05rem;margin:0 0 8px;padding-bottom:12px;border-bottom:1px solid var(--line-soft);
    color:var(--ink);text-transform:uppercase;letter-spacing:.06em;
  }
  ul.others-list{list-style:none;margin:0;padding:0;}
  ul.others-list li{
    padding:26px 0;border-bottom:1px solid var(--line-soft);
  }
  ul.others-list li:last-child{border-bottom:none;}
  ul.others-list .yr{
    display:block;font-weight:700;color:var(--accent);
    font-size:1.05rem;margin-bottom:8px;
  }
  ul.others-list p{
    margin:0 0 8px;line-height:1.7;color:var(--ink-dim);font-size:1rem;
  }
  ul.others-list a.more{font-size:.82rem;color:var(--ink-faint);text-decoration:none;}
  ul.others-list a.more:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px;}
  .empty-note{color:var(--ink-faint);font-size:.95rem;}

  footer.credit{
    margin-top:70px;padding-top:22px;border-top:1px solid var(--line-soft);
    font-size:.78rem;color:var(--ink-faint);text-align:center;
  }
  footer.credit a{color:var(--ink-faint);}
</style>
</head>
<body>

<div id="app">

  <section id="landing" class="screen">
    <div class="inner">
      <span class="eyebrow">Tego dnia</span>
      <span class="big-date" id="landing-date">7 września</span>
      <p class="tagline">Każdy dzień w kalendarzu skrywa kilka historii. Który chcesz dziś otworzyć?</p>

      <div class="picker">
        <select id="sel-day" aria-label="Dzień"></select>
        <span class="joiner">/</span>
        <select id="sel-month" aria-label="Miesiąc"></select>
      </div>

      <button class="cta" id="btn-explore">Odkryj →</button>
      <span class="hint">albo <button id="btn-today" type="button">wróć do dzisiaj</button></span>
    </div>
  </section>

  <section id="results" class="screen" hidden>
    <div class="results-inner">
      <div class="results-head">
        <h1 id="results-date">—</h1>
        <button class="back-link" id="btn-back">← inny dzień</button>
      </div>

      <div id="results-body">
        <p class="state-msg" id="state-loading" hidden>Otwieram archiwa…</p>
        <p class="state-msg" id="state-error" hidden>
          Coś przerwało łącze z archiwum. Spróbujmy jeszcze raz.
          <button class="cta retry" id="btn-retry">Spróbuj ponownie</button>
          <span class="err-detail" id="err-detail"></span>
        </p>

        <div id="content" hidden>
          <div class="hero" id="hero"></div>
          <div class="others">
            <h2>Inne ważne wydarzenia</h2>
            <ul class="others-list" id="others-list"></ul>
          </div>
        </div>
      </div>

      <footer class="credit">
        Źródło: <a href="https://pl.wikipedia.org/" target="_blank" rel="noopener">Wikipedia</a> i
        <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a>, treści na licencji CC BY‑SA.
      </footer>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";

  var MONTHS_GEN = ["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"];
  var MONTHS_NOM = ["styczeń","luty","marzec","kwiecień","maj","czerwiec","lipiec","sierpień","wrzesień","październik","listopad","grudzień"];
  var DAYS_IN_MONTH = [31,29,31,30,31,30,31,31,30,31,30,31];
  var POLAND_RE = /Polsk|Rzeczpospolit|Warszaw|Krak[oó]w|\bSejm|Wojsko Polskie\b|\bPRL\b|III Rzeczypospolit|Ksi[eę]stwa Warszawskiego|Gda[nń]sk|Pozna[nń]|Wroc[lł]aw|Lw[oó]w|Piast[oó]w|Jagiell/i;

  var landingEl = document.getElementById("landing");
  var resultsEl = document.getElementById("results");
  var landingDateEl = document.getElementById("landing-date");
  var resultsDateEl = document.getElementById("results-date");
  var selDay = document.getElementById("sel-day");
  var selMonth = document.getElementById("sel-month");
  var btnExplore = document.getElementById("btn-explore");
  var btnToday = document.getElementById("btn-today");
  var btnBack = document.getElementById("btn-back");
  var btnRetry = document.getElementById("btn-retry");
  var stateLoading = document.getElementById("state-loading");
  var stateError = document.getElementById("state-error");
  var errDetail = document.getElementById("err-detail");
  var content = document.getElementById("content");
  var heroEl = document.getElementById("hero");
  var othersListEl = document.getElementById("others-list");

  var today = new Date();
  var currentDay = today.getDate();
  var currentMonth = today.getMonth() + 1;
  var lastRequest = null;

  function pad(n){ return String(n).padStart(2, "0"); }

  function formatYear(y){
    return y < 0 ? (-y) + " p.n.e." : String(y);
  }

  function fillMonthSelect(){
    MONTHS_NOM.forEach(function(name, i){
      var opt = document.createElement("option");
      opt.value = i + 1;
      opt.textContent = name.charAt(0).toUpperCase() + name.slice(1);
      selMonth.appendChild(opt);
    });
  }

  function fillDaySelect(month){
    var max = DAYS_IN_MONTH[month - 1];
    var prev = Number(selDay.value) || currentDay;
    selDay.innerHTML = "";
    for (var d = 1; d <= max; d++){
      var opt = document.createElement("option");
      opt.value = d;
      opt.textContent = d;
      selDay.appendChild(opt);
    }
    selDay.value = Math.min(prev, max);
  }

  function setPickerTo(day, month){
    selMonth.value = month;
    fillDaySelect(month);
    selDay.value = day;
  }

  function formatDate(day, month){
    return day + " " + MONTHS_GEN[month - 1];
  }

  function el(tag, attrs, text){
    var node = document.createElement(tag);
    if (attrs){
      Object.keys(attrs).forEach(function(k){ node.setAttribute(k, attrs[k]); });
    }
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function wikiUrl(title){
    return "https://pl.wikipedia.org/wiki/" + encodeURIComponent(title.replace(/ /g, "_"));
  }

  function renderHero(pick){
    heroEl.innerHTML = "";
    if (!pick){
      heroEl.hidden = true;
      return;
    }
    heroEl.hidden = false;
    var entry = pick.entry;
    var images = pick.images || [];
    heroEl.appendChild(el("span", { "class": "section-label" }, "Najważniejsze wydarzenie"));

    if (pick.title){
      heroEl.appendChild(el("h2", { "class": "hero-title" }, pick.title));
    }

    if (images[0]){
      var figure = el("figure");
      var img = el("img");
      img.src = images[0].source;
      img.alt = images[0].caption || pick.title || entry.text;
      img.loading = "lazy";
      figure.appendChild(img);
      if (images[0].caption) figure.appendChild(el("figcaption", null, images[0].caption));
      heroEl.appendChild(figure);
    }

    var lead = el("p", { "class": "lead" });
    lead.appendChild(el("span", { "class": "year" }, formatYear(entry.year)));
    lead.appendChild(document.createTextNode(entry.text));
    heroEl.appendChild(lead);

    var paragraphs = pick.paragraphs || [];
    var extraImages = images.slice(1);
    paragraphs.forEach(function(para, i){
      heroEl.appendChild(el("p", { "class": "extract" }, para));
      var inline = extraImages[i];
      if (i < paragraphs.length - 1 && inline){
        var figure2 = el("figure", { "class": "inline-figure" });
        var img2 = el("img");
        img2.src = inline.source;
        img2.alt = inline.caption || "";
        img2.loading = "lazy";
        figure2.appendChild(img2);
        if (inline.caption) figure2.appendChild(el("figcaption", null, inline.caption));
        heroEl.appendChild(figure2);
      }
    });

    if (pick.pageUrl){
      var src = el("p", { "class": "src" });
      src.appendChild(el("a", { href: pick.pageUrl, target: "_blank", rel: "noopener" }, "Czytaj więcej →"));
      heroEl.appendChild(src);
    }
  }

  function renderOthers(items){
    othersListEl.innerHTML = "";
    if (!items.length){
      var li = el("li");
      li.appendChild(el("span", { "class": "empty-note" }, "Tego dnia archiwa milczą o innych wydarzeniach."));
      othersListEl.appendChild(li);
      return;
    }
    items.forEach(function(item){
      var li = el("li");
      li.appendChild(el("span", { "class": "yr" }, formatYear(item.entry.year)));
      var text = (item.paragraphs && item.paragraphs[0]) ? item.paragraphs[0] : item.entry.text;
      li.appendChild(el("p", null, text));
      if (item.pageUrl){
        li.appendChild(el("a", { "class": "more", href: item.pageUrl, target: "_blank", rel: "noopener" }, "Wikipedia →"));
      }
      othersListEl.appendChild(li);
    });
  }

  function removeEntry(list, entry){
    return list.filter(function(e){ return !(e.year === entry.year && e.text === entry.text); });
  }

  // ---- wikitext parsing ----

  function stripWikitext(raw){
    var text = raw;
    text = text.replace(/<!--[\s\S]*?-->/g, "");
    text = text.replace(/<ref[^>]*\/>/gi, "");
    text = text.replace(/<ref[^>]*>[\s\S]*?<\/ref>/gi, "");
    text = text.replace(/\{\{[^{}]*\}\}/g, "");
    text = text.replace(/\{\{[^{}]*\}\}/g, "");
    var links = [];
    text = text.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, function(full, target, display){
      var t = target.trim();
      if (t && links.indexOf(t) === -1) links.push(t);
      return (display !== undefined && display !== "") ? display : t;
    });
    text = text.replace(/\[(https?:\/\/[^\s\]]+)\s*([^\]]*)\]/g, function(full, url, label){ return label || url; });
    text = text.replace(/'''''/g, "").replace(/'''/g, "").replace(/''/g, "");
    text = text.replace(/<[^>]+>/g, "");
    text = text.replace(/\s+/g, " ").trim();
    text = text.replace(/:$/, "").trim();
    return { text: text, firstLink: links[0] || null, links: links };
  }

  function splitBulletDepth(line){
    var m = line.match(/^(\*{1,2})\s*(.*)$/);
    if (!m) return null;
    var content = m[2].replace(/^&nbsp;\s*/i, "").trim();
    if (!content) return null;
    return { depth: m[1].length, content: content };
  }

  function parseYearPrefix(content){
    var ym = content.match(/^\[\[(\d{1,4})\]\]|^(\d{1,4})\b/);
    if (!ym) return null;
    var year = parseInt(ym[1] || ym[2], 10);
    var rest = content.slice(ym[0].length);
    var bc = rest.match(/^\s*p\.?\s*n\.?\s*e\.?/i);
    if (bc){ year = -year; rest = rest.slice(bc[0].length); }
    rest = rest.replace(/^\s*[–—-]\s*/, "").trim();
    if (rest === ":" || rest === "") rest = "";
    return { year: year, rest: rest };
  }

  function parseEventsSection(wikitext, heading){
    var escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    var re = new RegExp("==\\s*" + escaped + "\\s*==([\\s\\S]*?)(?:\\n==[^=]|$)", "i");
    var m = wikitext.match(re);
    if (!m) return [];
    var events = [];
    var currentYear = null;
    m[1].split("\n").forEach(function(line){
      var b = splitBulletDepth(line);
      if (!b) return;
      var rawText;
      if (b.depth === 1){
        var yp = parseYearPrefix(b.content);
        if (!yp) return;
        currentYear = yp.year;
        rawText = yp.rest;
      } else {
        if (currentYear === null) return;
        rawText = b.content;
      }
      if (!rawText) return;
      var parsed = stripWikitext(rawText);
      if (!parsed.text) return;
      events.push({ year: currentYear, text: parsed.text, linkTitle: parsed.firstLink, links: parsed.links });
    });
    return events;
  }

  async function fetchJson(url){
    var res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status + " " + url);
    return res.json();
  }

  function pageSummaryUrl(title){
    return "https://pl.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title.replace(/ /g, "_"));
  }

  function introExtractUrl(title){
    return "https://pl.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&titles=" +
      encodeURIComponent(title) + "&format=json&formatversion=2&origin=*";
  }

  function commonsSearchUrl(title){
    return "https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=" +
      encodeURIComponent(title) + "&gsrnamespace=6&gsrlimit=6&prop=imageinfo&iiprop=url|size&iiurlwidth=1200&format=json&formatversion=2&origin=*";
  }

  function pickCommonsImages(data, limit){
    if (!data || !data.query || !data.query.pages) return [];
    var pages = data.query.pages.filter(function(p){ return p.imageinfo && p.imageinfo.length; });
    pages.sort(function(a, b){
      var wa = a.imageinfo[0].thumbwidth || a.imageinfo[0].width || 0;
      var wb = b.imageinfo[0].thumbwidth || b.imageinfo[0].width || 0;
      return (wb >= 400 ? 1 : 0) - (wa >= 400 ? 1 : 0);
    });
    return pages.slice(0, limit).map(function(p){
      var ii = p.imageinfo[0];
      return {
        source: ii.thumburl || ii.url,
        caption: (p.title || "").replace(/^File:/i, "").replace(/\.[a-z0-9]{2,5}$/i, "").replace(/_/g, " ")
      };
    });
  }

  function extractParagraphs(introData, fallback){
    var page = introData && introData.query && introData.query.pages && introData.query.pages[0];
    var raw = page && page.extract;
    if (!raw) return fallback ? [fallback] : [];
    return raw.split(/\n+/).map(function(s){ return s.trim(); }).filter(Boolean).slice(0, 3);
  }

  async function enrichEntry(entry){
    if (!entry.linkTitle) return { entry: entry, images: [], paragraphs: [], pageUrl: null };
    var summary = await fetchJson(pageSummaryUrl(entry.linkTitle)).catch(function(){ return null; });
    var pageUrl = (summary && summary.content_urls && summary.content_urls.desktop && summary.content_urls.desktop.page) || wikiUrl(entry.linkTitle);
    return { entry: entry, images: [], paragraphs: summary && summary.extract ? [summary.extract] : [], pageUrl: pageUrl };
  }

  async function fetchLinkedTopic(title){
    var results = await Promise.all([
      fetchJson(pageSummaryUrl(title)).catch(function(){ return null; }),
      fetchJson(introExtractUrl(title)).catch(function(){ return null; }),
      fetchJson(commonsSearchUrl(title)).catch(function(){ return null; })
    ]);
    var summary = results[0];
    var images = pickCommonsImages(results[2], 4);
    if (!images.length && summary && summary.thumbnail && summary.thumbnail.source){
      images = [{ source: summary.thumbnail.source, caption: summary.description || summary.title || "" }];
    }
    return { linkTitle: title, summary: summary, introData: results[1], images: images };
  }

  async function enrichHero(entry){
    if (!entry.linkTitle) return { entry: entry, title: null, images: [], paragraphs: [], pageUrl: null };
    var candidates = (entry.links && entry.links.length ? entry.links : [entry.linkTitle]).slice(0, 2);
    var topics = await Promise.all(candidates.map(fetchLinkedTopic));
    var chosen = topics.find(function(t){ return t.images.length; }) || topics[0];
    var summary = chosen.summary;
    var title = (summary && summary.title) || chosen.linkTitle;
    var paragraphs = extractParagraphs(chosen.introData, summary && summary.extract);
    var pageUrl = (summary && summary.content_urls && summary.content_urls.desktop && summary.content_urls.desktop.page) || wikiUrl(chosen.linkTitle);
    return { entry: entry, title: title, images: chosen.images, paragraphs: paragraphs, pageUrl: pageUrl };
  }

  async function pickHero(candidates){
    var top = candidates.filter(function(c){ return c.linkTitle; }).slice(0, 3);
    if (!top.length) return null;
    var enriched = await Promise.all(top.map(enrichHero));
    var withImage = enriched.find(function(e){ return e.images.length; });
    return withImage || enriched[0];
  }

  async function loadDay(day, month, requestId){
    stateLoading.hidden = false;
    stateError.hidden = true;
    errDetail.textContent = "";
    content.hidden = true;

    var title = formatDate(day, month);

    try {
      var apiUrl = "https://pl.wikipedia.org/w/api.php?action=parse&page=" +
        encodeURIComponent(title) + "&prop=wikitext&format=json&formatversion=2&origin=*";
      var data = await fetchJson(apiUrl);
      if (requestId !== lastRequest) return;

      if (data.error) throw new Error(data.error.info || data.error.code || "Błąd API Wikipedii");
      if (!data.parse || typeof data.parse.wikitext !== "string") throw new Error("Nieoczekiwana odpowiedź API");

      var wikitext = data.parse.wikitext;
      var poland = parseEventsSection(wikitext, "Wydarzenia w Polsce");
      var world = parseEventsSection(wikitext, "Wydarzenia na świecie");

      if (!poland.length && !world.length){
        parseEventsSection(wikitext, "Wydarzenia").forEach(function(e){
          (POLAND_RE.test(e.text) ? poland : world).push(e);
        });
      }

      if (!poland.length && !world.length) throw new Error("Nie znaleziono wydarzeń dla tej daty w artykule „" + title + "”");

      var byRecency = world.concat(poland).sort(function(a, b){ return b.year - a.year; });
      var hero = await pickHero(byRecency);
      if (requestId !== lastRequest) return;

      var rest = hero ? removeEntry(byRecency, hero.entry) : byRecency;
      var otherCandidates = rest.slice(0, 5);
      var others = await Promise.all(otherCandidates.map(enrichEntry));
      if (requestId !== lastRequest) return;

      renderHero(hero);
      renderOthers(others);

      stateLoading.hidden = true;
      content.hidden = false;
    } catch (err){
      if (requestId !== lastRequest) return;
      console.error("Tego dnia — błąd pobierania:", err);
      stateLoading.hidden = true;
      stateError.hidden = false;
      errDetail.textContent = err && err.message ? err.message : String(err);
    }
  }

  function showResults(day, month){
    resultsDateEl.textContent = formatDate(day, month);
    location.hash = pad(month) + "-" + pad(day);
    landingEl.hidden = true;
    resultsEl.hidden = false;
    lastRequest = Date.now();
    loadDay(day, month, lastRequest);
  }

  function showLanding(){
    resultsEl.hidden = true;
    landingEl.hidden = false;
    history.pushState(null, "", location.pathname + location.search);
  }

  function updateLandingDate(){
    landingDateEl.textContent = formatDate(currentDay, currentMonth);
  }

  fillMonthSelect();
  setPickerTo(currentDay, currentMonth);
  updateLandingDate();

  selMonth.addEventListener("change", function(){
    fillDaySelect(Number(selMonth.value));
  });

  btnExplore.addEventListener("click", function(){
    showResults(Number(selDay.value), Number(selMonth.value));
  });

  btnToday.addEventListener("click", function(){
    setPickerTo(currentDay, currentMonth);
  });

  btnBack.addEventListener("click", showLanding);
  btnRetry.addEventListener("click", function(){
    var d = Number(selDay.value), m = Number(selMonth.value);
    lastRequest = Date.now();
    loadDay(d, m, lastRequest);
  });

  window.addEventListener("popstate", function(){
    if (!location.hash) showLanding();
  });

  var hashMatch = location.hash.match(/^#(\d{2})-(\d{2})$/);
  if (hashMatch){
    var m = Number(hashMatch[1]), d = Number(hashMatch[2]);
    if (m >= 1 && m <= 12 && d >= 1 && d <= DAYS_IN_MONTH[m - 1]){
      setPickerTo(d, m);
      showResults(d, m);
    }
  }
})();
</script>
